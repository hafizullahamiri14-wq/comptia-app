er internet"], "answer": 1, "explain": "The defining disadvantage of satellite internet is its inherently higher latency, caused by the substantial physical distance a signal must travel between the ground station, the orbiting satellite, and back, which is especially long for older geostationary satellites. Satellite internet is actually most valuable specifically IN rural areas lacking other infrastructure, it does not require a telephone line connection (that's DSL), and it is generally slower with higher latency than fiber, not faster."}, {"q": "A technician is helping a client choose an internet connection type for a home office that requires very low latency for real-time video conferencing and large file uploads. Which connection type would generally be the BEST choice, if available in their area?", "options": ["Satellite", "DSL", "Fiber", "Dial-up"], "answer": 2, "explain": "Fiber-optic internet offers the lowest latency and highest, most symmetrical (equal upload/download) speeds among common connection types, making it ideal for latency-sensitive applications like real-time video conferencing and large file uploads. Satellite has notably high latency unsuitable for real-time applications, DSL offers much lower speeds and higher latency than fiber, and dial-up is an obsolete, extremely slow connection type unsuitable for modern needs."}, {"q": "Which of the following network types is typically confined to a single building or a small group of nearby buildings, such as an office or home network?", "options": ["WAN", "LAN", "MAN", "SAN"], "answer": 1, "explain": "A LAN (Local Area Network) is a network confined to a relatively small geographic area, such as a single home, office, or building, connecting devices for local resource sharing and communication. A WAN spans much larger geographic distances (potentially global), a MAN covers a metropolitan area (like a city), and a SAN is specifically designed for high-speed storage connectivity rather than general geographic scope."}, {"q": "Which network type connects multiple LANs across a large geographic area, such as connecting a company's offices located in different cities or countries?", "options": ["PAN", "WAN", "WLAN", "SAN"], "answer": 1, "explain": "A WAN (Wide Area Network) connects multiple LANs across large geographic distances, such as linking a company's various office locations in different cities, states, or even countries, often using leased lines, VPNs, or other long-distance connectivity solutions. A PAN covers a very small personal space, a WLAN is simply the wireless version of a LAN (still geographically limited), and a SAN is dedicated to storage connectivity, not general-purpose wide-area networking."}, {"q": "Which network type describes a very small-scale network typically involving devices within a few meters of a single person, such as a smartphone connected to a Bluetooth headset and a smartwatch?", "options": ["LAN", "WAN", "PAN", "MAN"], "answer": 2, "explain": "A PAN (Personal Area Network) describes an extremely limited-range network, typically encompassing devices within just a few meters of a single individual, commonly using technologies like Bluetooth to connect items such as a smartphone, smartwatch, and wireless headset. A LAN covers a larger area like a whole home or office, a WAN spans a much greater geographic distance, and a MAN covers an entire metropolitan area — all considerably larger in scope than a PAN."}, {"q": "Which network type covers a geographic area roughly the size of a city or a large campus, larger than a typical LAN but smaller than a WAN?", "options": ["PAN", "MAN", "SAN", "WLAN"], "answer": 1, "explain": "A MAN (Metropolitan Area Network) covers a geographic area comparable to a city or a large university/corporate campus, bridging the gap in scale between a smaller LAN and a much larger WAN, often used by municipalities or large institutions to connect multiple sites within that metro area. A PAN is far smaller in scope (a few meters around a person), a SAN is a specialized storage-focused network (not defined by general geographic scope), and a WLAN is simply a wireless LAN, typically confined to a single building or campus, not necessarily a full metropolitan area."}, {"q": "Which network type is specifically designed to provide high-speed, dedicated connectivity between servers and shared storage devices, often used in data centers to centralize and consolidate storage resources?", "options": ["LAN", "WAN", "SAN", "PAN"], "answer": 2, "explain": "A SAN (Storage Area Network) is a specialized, high-speed network specifically architected to connect servers to centralized, shared storage devices (such as disk arrays), commonly deployed in data centers to consolidate and efficiently manage storage resources separately from general network traffic. A standard LAN handles general local network traffic (not specifically optimized for storage), a WAN connects networks over large distances, and a PAN is a very small-scale personal device network — none are purpose-built for dedicated high-speed storage connectivity."}, {"q": "Which of the following BEST describes a WLAN (Wireless Local Area Network)?", "options": ["A network that spans an entire country using satellite links", "A local area network that uses wireless technology (such as Wi-Fi) instead of physical cables to connect devices within a limited geographic area", "A network exclusively used for connecting storage devices", "A network limited to devices within a few centimeters of each other"], "answer": 1, "explain": "A WLAN (Wireless Local Area Network) is functionally similar to a traditional wired LAN in terms of its limited geographic scope (a home, office, or campus), but it uses wireless technology, most commonly Wi-Fi, to connect devices instead of running physical Ethernet cables. It does not span an entire country (that scale would be closer to a WAN), it is not specifically for storage devices (that's a SAN's purpose), and its range extends well beyond just a few centimeters, unlike very short-range technologies such as NFC."}, {"q": "A small business has computers, printers, and a server connected within a single office suite using both wired Ethernet and Wi-Fi. Which network type BEST describes this overall setup?", "options": ["WAN", "LAN (potentially including a WLAN component)", "SAN", "MAN"], "answer": 1, "explain": "This scenario describes a LAN, since all devices are confined to a single office location; the Wi-Fi portion of this network would specifically be considered a WLAN, while the wired Ethernet connections remain a traditional (wired) LAN segment — together, the overall local network is still classified as a LAN. This setup does not span the large geographic distances characteristic of a WAN, it is not a dedicated storage network (SAN), and it does not cover an entire metropolitan area (MAN), which would involve a much larger geographic scope."}, {"q": "Which of the following is the BEST example of a PAN (Personal Area Network) in everyday use?", "options": ["A corporate office connecting 200 employees via Ethernet and Wi-Fi", "A smartphone connected via Bluetooth to a fitness tracker and wireless earbuds", "A city government's network connecting multiple municipal buildings", "A data center connecting servers to a shared storage array"], "answer": 1, "explain": "A smartphone paired via Bluetooth with a fitness tracker and wireless earbuds is a classic real-world example of a PAN, since it involves a very small number of devices connected within a very limited range around a single individual. A large corporate office network of that scale is a LAN, a citywide municipal network connecting multiple buildings would be a MAN, and a data center connecting servers to shared storage describes a SAN, not a PAN."}, {"q": "A large company headquartered in New York has branch offices in Los Angeles and London, all connected together to share resources and communicate over long distances. Which network type BEST describes the overall connection linking these locations?", "options": ["LAN", "WAN", "PAN", "WLAN"], "answer": 1, "explain": "Since this scenario involves connecting multiple office locations across vast geographic distances (different cities, even different countries), it describes a WAN (Wide Area Network), which is specifically designed to link separate LANs over large distances, often using the internet, leased lines, or other long-haul connectivity methods. A LAN or WLAN would only describe the network within a SINGLE one of these office locations, not the connections between them, and a PAN is far too limited in scope (a few meters around a person) to describe this scenario."}, {"q": "Which of the following BEST explains why a SAN is often kept as a separate, dedicated network rather than sharing the same infrastructure as a company's general LAN traffic?", "options": ["SANs cannot function unless combined with all other network traffic", "Separating SAN traffic helps ensure the high performance, low latency, and reliability needed for storage operations, without competing for bandwidth with general LAN/user traffic", "SANs are only used for internet browsing traffic", "Combining SAN and LAN traffic always improves performance for both"], "answer": 1, "explain": "Keeping SAN traffic on its own dedicated network infrastructure (often using technologies like Fibre Channel or dedicated iSCSI networks) ensures the consistently high performance, low latency, and reliability that storage operations require, without that traffic competing with and potentially being degraded by general LAN/user network activity such as web browsing or email. SANs do not require combination with general traffic to function, they are not used for internet browsing (their purpose is dedicated storage connectivity), and combining SAN and LAN traffic on shared infrastructure typically degrades rather than improves performance for both."}, {"q": "Which of the following internet connection types is generally the MOST susceptible to signal disruption from severe weather conditions, such as heavy rain or snow?", "options": ["Fiber", "Satellite", "Cable", "DSL"], "answer": 1, "explain": "Satellite internet is particularly susceptible to disruption from severe weather conditions like heavy rain, snow, or storms (sometimes called \"rain fade\"), since the signal must travel through the atmosphere to and from an orbiting satellite, and adverse weather can degrade or interrupt that signal path. Fiber, cable, and DSL all rely on physical, buried, or aerial cabling that is far less directly affected by atmospheric weather conditions in normal operating circumstances."}, {"q": "A remote construction site has no wired internet infrastructure available, but has excellent cellular signal coverage. Which internet connection type would allow workers to have functional internet access at this location?", "options": ["Fiber", "DSL", "Cellular (via a mobile hotspot or cellular modem/router)", "Cable"], "answer": 2, "explain": "A cellular internet connection, accessed via a mobile hotspot device or a dedicated cellular modem/router, allows internet connectivity at locations with good cellular signal but no wired infrastructure, making it a practical and flexible solution for temporary or remote sites like a construction location. Fiber, DSL, and cable all require dedicated physical wired infrastructure to be run to the specific location, which would not be available at a remote site lacking such connections."}, {"q": "Which of the following BEST distinguishes a WISP (Wireless Internet Service Provider) from a standard cellular internet connection?", "options": ["A WISP uses a company's dedicated fixed wireless towers/infrastructure serving a specific local area, while cellular internet uses the much broader cellular network of a major mobile carrier", "A WISP and cellular internet are functionally identical technologies", "A WISP requires a wired telephone line, while cellular does not", "Cellular internet has no coverage limitations, while WISP coverage is limited to major cities only"], "answer": 0, "explain": "A WISP operates its own dedicated fixed wireless infrastructure (towers and antennas) to serve customers within a specific, often rural or underserved local area, whereas cellular internet relies on the much broader cellular network infrastructure built and maintained by a major mobile carrier for wide-area mobile connectivity. These are not identical technologies, a WISP does not require a wired telephone line (its defining feature is wireless delivery), and cellular internet coverage is not unlimited — it depends on carrier tower placement and signal strength, while some WISPs actually specialize in serving rural areas lacking cellular coverage, not just major cities."}, {"q": "Which of the following internet connection types generally offers the MOST symmetrical (roughly equal) upload and download speeds, making it well suited for businesses that frequently upload large files or host services?", "options": ["DSL", "Cable", "Fiber", "Satellite"], "answer": 2, "explain": "Fiber-optic internet commonly offers symmetrical or near-symmetrical upload and download speeds, meaning uploads perform nearly as fast as downloads, which is particularly valuable for businesses that need to frequently upload large files, host servers, or support heavy video conferencing. DSL and cable connections traditionally provide significantly asymmetrical speeds (much faster downloads than uploads), and satellite internet typically has both lower speeds and higher latency, making it less suited for upload-intensive business use cases."}, {"q": "Which network type would a home user's setup MOST likely be classified as if they have a router connecting a desktop computer, a smart TV, and a laptop, all within their house, with some devices wired and some connected via Wi-Fi?", "options": ["WAN", "MAN", "LAN", "SAN"], "answer": 2, "explain": "A home network connecting several devices within a single residence, regardless of whether the connections are wired or wireless, is classified as a LAN (Local Area Network), since it is confined to a small, local geographic area. A WAN would involve connecting multiple separate locations over long distances, a MAN would cover an entire metropolitan area, and a SAN is a specialized network for storage devices, not a description of a typical home network."}, {"q": "A city government deploys a network of interconnected Wi-Fi access points and fiber links to provide connectivity across multiple government buildings throughout the downtown area, without extending service to the wider region or state. Which network type BEST describes this deployment?", "options": ["PAN", "MAN", "WAN", "SAN"], "answer": 1, "explain": "This scenario, involving interconnected access points and infrastructure across multiple buildings within a defined city/downtown area (but not extending regionally or statewide), is a textbook example of a MAN (Metropolitan Area Network), which is specifically scoped to cover an area roughly the size of a city. A PAN is far too small in scope for this scenario, a WAN would need to extend across a much larger geographic area (well beyond a single city), and a SAN is a dedicated storage network, unrelated to this general municipal connectivity deployment."}, {"q": "Which of the following BEST summarizes the overall relationship between internet connection types (like fiber, cable, DSL, satellite, cellular, WISP) and network types (like LAN, WAN, PAN, MAN, SAN, WLAN)?", "options": ["They are the same concept described with different terminology", "Internet connection types describe HOW a network connects to the broader internet from an external provider, while network types describe the SCOPE and STRUCTURE of the network itself (e.g., how devices within or across locations are organized and connected)", "Network types determine which internet connection type a customer's ISP will offer them", "Internet connection types and network types cannot coexist in the same overall network design"], "answer": 1, "explain": "Internet connection types (fiber, cable, DSL, satellite, cellular, WISP) describe the specific method and technology used to connect a location's network to an external internet service provider and the broader internet, while network types (LAN, WAN, PAN, MAN, SAN, WLAN) describe the internal scope, scale, and structural organization of a network itself, whether within a single home, across a whole company, or throughout a city. These are related but distinct concepts, not interchangeable terminology, the network type chosen for an internal deployment does not dictate which ISP internet connection type is used, and in practice, both concepts routinely coexist — for example, a home LAN commonly connects to the internet via a cable or fiber internet connection type."}]}, {"slug": "net-tools", "label": "Networking Tools", "domain": "2.0 Networking", "questions": [{"q": "Which networking tool is used to attach an RJ-45 connector to the end of an Ethernet cable, securing the individual wires in place so the cable can be plugged into a jack or port?", "options": ["Punchdown tool", "Crimper", "Toner probe", "Loopback plug"], "answer": 1, "explain": "A crimper (crimping tool) is specifically designed to attach connectors, such as RJ-45 plugs, to the end of a network cable by compressing the connector's pins into the individual wires, creating a secure electrical connection. A punchdown tool terminates wires into a patch panel or keystone jack (not a plug-style connector), a toner probe locates cables, and a loopback plug tests port functionality — none attach connectors to cable ends."}, {"q": "A technician needs to remove the outer plastic insulation from the end of an Ethernet cable to expose the individual internal wires before terminating it with a connector. Which tool should be used?", "options": ["Cable stripper", "Wi-Fi analyzer", "Network tap", "Cable tester"], "answer": 0, "explain": "A cable stripper is designed to safely remove the outer jacket/insulation from a cable, exposing the internal wire pairs, without damaging them, which is a necessary preparatory step before crimping on a connector or punching down into a jack/panel. A Wi-Fi analyzer assesses wireless signal characteristics, a network tap intercepts network traffic for monitoring, and a cable tester checks a cable's continuity/wiring after termination — none prepare a cable by stripping its outer jacket."}, {"q": "A technician is troubleshooting Wi-Fi interference in a busy office and wants to identify which channels are being used by nearby wireless networks and measure signal strength across different areas. Which tool is MOST appropriate?", "options": ["Toner probe", "Wi-Fi analyzer", "Punchdown tool", "Crimper"], "answer": 1, "explain": "A Wi-Fi analyzer is a software or hardware tool that scans wireless networks, displaying information such as channel usage, signal strength, and interference sources, helping technicians select the best channel and diagnose wireless performance issues. A toner probe locates cables in a bundle, a punchdown tool terminates wires into jacks/panels, and a crimper attaches connectors to cable ends — none analyze wireless spectrum or signal data."}, {"q": "A technician needs to identify which specific cable, among a large, unlabeled bundle running through a wall, corresponds to a particular wall jack. Which tool is BEST suited for this task?", "options": ["Cable tester", "Toner probe (tone generator and probe)", "Loopback plug", "Network tap"], "answer": 1, "explain": "A toner probe (consisting of a tone generator connected to one end of a cable and a probe that detects the generated tone) allows a technician to trace and identify a specific cable within a bundle or behind a wall by listening for the tone signal, even without seeing the cable's full path. A cable tester checks a cable's wiring integrity (not tracing/identification), a loopback plug tests port functionality, and a network tap intercepts and monitors live network traffic."}, {"q": "Which networking tool is used to terminate individual wires from a network cable directly into the small metal contacts of a keystone jack or patch panel, without needing a separate connector housing?", "options": ["Crimper", "Punchdown tool", "Cable stripper", "Wi-Fi analyzer"], "answer": 1, "explain": "A punchdown tool is used to press (punch down) individual wire conductors into the insulation-displacement contacts (IDCs) of a keystone jack or patch panel, creating a secure electrical connection without requiring an external connector housing like an RJ-45 plug. A crimper attaches connectors like RJ-45 plugs onto cable ends (a different termination method), a cable stripper only removes outer insulation, and a Wi-Fi analyzer deals with wireless signal analysis, unrelated to physical wire termination."}, {"q": "A technician has just terminated a new Ethernet cable run and wants to verify that all eight wires are correctly connected in the proper pin order, with no shorts, opens, or miswires. Which tool should be used?", "options": ["Loopback plug", "Cable tester", "Network tap", "Wi-Fi analyzer"], "answer": 1, "explain": "A cable tester checks a newly terminated (or existing) cable for correct wiring order, continuity, shorts, opens, and miswired pairs, verifying that the cable will function correctly before it's put into active use. A loopback plug tests a network port/NIC's basic send/receive functionality (not full cable wiring order), a network tap monitors live traffic passing through a connection, and a Wi-Fi analyzer is for wireless network diagnostics, not physical cable testing."}, {"q": "Which small device is plugged directly into a network port or NIC to test whether that port can successfully send and receive data by looping the transmit ssues."}, {"q": "A technician is organizing a server room and needs to terminate dozens of Ethernet cables into the back of a 48-port patch panel as efficiently as possible. Which tool is specifically designed for this high-volume termination task?", "options": ["Crimper", "Punchdown tool", "Loopback plug", "Network tap"], "answer": 1, "explain": "A punchdown tool is specifically designed for efficiently terminating wires into the insulation-displacement contacts found on patch panels and keystone jacks, making it the appropriate and standard tool for a high-volume termination task like wiring a 48-port patch panel. A crimper is used for attaching connectors to individual cable ends (a different termination style used for plugs, not patch panel punch-down contacts), and a loopback plug and network tap are testing/monitoring tools, not termination tools."}, {"q": "Which of the following BEST describes a key difference between a cable tester and a loopback plug?", "options": ["They perform identical functions and can be used interchangeably in every situation", "A cable tester typically checks a cable's full wiring/pinout for continuity, shorts, and miswires, while a loopback plug specifically tests a port/NIC's ability to send and receive by looping a signal back on itself", "A loopback plug checks Wi-Fi signal strength, while a cable tester does not", "A cable tester is used exclusively for fiber-optic cables, while a loopback plug is used exclusively for coaxial cables"], "answer": 1, "explain": "A cable tester is generally used to verify a cable's overall wiring integrity, checking for correct pinout, continuity, and problems like shorts or miswired pairs across its full length, while a loopback plug is inserted into a single port to specifically test that port's/NIC's basic ability to transmit and receive by electrically looping the outgoing signal back to the input. These tools are not interchangeable and serve different diagnostic purposes, neither tool relates to Wi-Fi signal strength, and neither tool is exclusively restricted to fiber-optic or coaxial cable types as described."}, {"q": "A technician is preparing a length of raw Cat 6 cable to be terminated with a keystone jack. What is the CORRECT order of tools typically used in this process?", "options": ["Crimper, then cable stripper, then punchdown tool", "Cable stripper, then punchdown tool", "Toner probe, then crimper", "Network tap, then loopback plug"], "answer": 1, "explain": "The correct general sequence for terminating a cable into a keystone jack begins with a cable stripper to remove the outer jacket and expose the internal wires, followed by a punchdown tool to press and secure each individual wire into the jack's contacts in the correct order. A crimper is used for attaching RJ-45 plug connectors (a different termination method than a keystone jack), and a toner probe, network tap, and loopback plug are diagnostic/monitoring tools unrelated to the physical termination process itself."}, {"q": "Which of the following scenarios BEST illustrates an appropriate use of a toner probe?", "options": ["Verifying a cable has no shorts before connecting it to a switch", "Locating one specific unlabeled cable among a dozen similar cables bundled together in a ceiling, to determine which wall jack it leads to", "Testing whether a network port can send and receive data", "Measuring the signal strength of a wireless access point"], "answer": 1, "explain": "The toner probe's defining use case is tracing and identifying a specific cable within a group of similar, unlabeled cables (such as a bundle running through a ceiling or wall) by generating a tone on one end and detecting it with a probe at the other end. Verifying a cable has no shorts is the role of a cable tester, testing a port's send/receive capability is the role of a loopback plug, and measuring wireless signal strength is the role of a Wi-Fi analyzer."}, {"q": "Which networking tool would a network administrator use to capture and analyze suspicious traffic between a compromised workstation and the rest of the network for a security investigation, without alerting the potential attacker or disrupting the connection?", "options": ["Crimper", "Network tap", "Cable stripper", "Punchdown tool"], "answer": 1, "explain": "A network tap allows a network administrator to passively capture a full copy of the traffic flowing between a compromised workstation and the network, feeding it to a monitoring/analysis tool, without disrupting the live connection or introducing detectable changes that might alert an attacker. A crimper and cable stripper are both used for physically preparing/terminating cables, and a punchdown tool terminates wires into jacks/panels — none are used for passive, inline traffic capture."}, {"q": "A technician just finished crimping a new RJ-45 connector onto a cable and wants to be certain the cable will actually work before installing it in a live environment. Which tool provides the MOST appropriate verification?", "options": ["Wi-Fi analyzer", "Cable tester", "Punchdown tool", "Crimper (again)"], "answer": 1, "explain": "A cable tester is the appropriate next step after crimping a connector, as it verifies that all wires were correctly connected during the crimping process — checking pinout order, continuity, and the absence of shorts or opens — confirming the cable is ready for reliable use. A Wi-Fi analyzer is unrelated to wired cable verification, a punchdown tool is used for a different termination method (jacks/panels, not plugs), and re-using the crimper again would not verify the existing termination's correctness."}, {"q": "Which of the following BEST summarizes the overall distinction between tools used for cable TERMINATION (such as a crimper, cable stripper, and punchdown tool) versus tools used for testing/diagnostics (such as a cable tester, loopback plug, toner probe, network tap, and Wi-Fi analyzer)?", "options": ["All of these tools perform the exact same function regardless of category", "Termination tools are used to physically prepare and connect cable ends to connectors or jacks, while testing/diagnostic tools are used afterward to verify functionality, trace connections, or monitor/analyze traffic and wireless signals", "Testing tools are used before termination tools in every single scenario", "Termination tools are exclusively used for wireless networks, while testing tools are exclusively used for wired networks"], "answer": 1, "explain": "Termination tools (crimper, cable stripper, punchdown tool) are used in the physical process of preparing a cable and connecting its wires to a connector (like an RJ-45 plug) or a termination point (like a keystone jack or patch panel), while testing/diagnostic tools (cable tester, loopback plug, toner probe, network tap, Wi-Fi analyzer) are used afterward — or independently — to verify that connections work correctly, trace cable paths, or monitor and analyze network traffic and wireless signals. These tools do not perform identical functions, termination generally precedes testing (not the reverse) in a proper cable installation workflow, and termination tools are used specifically for WIRED connections, while a Wi-Fi analyzer among the testing tools is specifically for WIRELESS diagnostics — the wired/wireless split does not align with the termination/testing categories as stated."}]}];

let soundOn = true;
let currentTopic = null; // {label, questions}
let order = [];
let idx = 0;
let score = 0;
let missed = [];
let answered = false;
let reviewMode = false;
let reviewList = [];

const panel = document.getElementById('panel');
const mastheadSub = document.getElementById('masthead-sub');

function letterOf(i) { return ['A','B','C','D'][i]; }
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function speak(text) {
  if (!soundOn || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1;
  utter.pitch = 1;
  window.speechSynthesis.speak(utter);
}

function renderMenu() {
  mastheadSub.textContent = '336 questions · Mobile Devices & Networking';
  const domains = {};
  topics.forEach(t => {
    if (!domains[t.domain]) domains[t.domain] = [];
    domains[t.domain].push(t);
  });

  let html = `<button class="all-topics-btn" id="all-btn">&#9733; Full Drill — All 336 Questions (Shuffled)</button>`;

  Object.keys(domains).forEach(domain => {
    html += `<div class="domain-group"><div class="domain-label">${escapeHtml(domain)}</div><div class="topic-list">`;
    domains[domain].forEach(t => {
      html += `<button class="topic-btn" data-slug="${t.slug}">
        <span>${escapeHtml(t.label)}</span>
        <span class="count">${t.questions.length} Q</span>
      </button>`;
    });
    html += `</div></div>`;
  });

  panel.innerHTML = html;

  document.getElementById('all-btn').addEventListener('click', () => {
    const allQ = topics.flatMap(t => t.questions);
    startTopic('All Topics', allQ);
  });
  document.querySelectorAll('.topic-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = topics.find(x => x.slug === btn.dataset.slug);
      startTopic(t.label, t.questions);
    });
  });
}

function startTopic(label, questions) {
  currentTopic = { label, questions };
  order = shuffle([...Array(questions.length).keys()]);
  idx = 0;
  score = 0;
  missed = [];
  reviewMode = false;
  reviewList = [];
  mastheadSub.textContent = label;
  renderQuestion();
}

function currentList() { return reviewMode ? reviewList : order; }

function renderQuestion() {
  const list = currentList();
  const qIndex = list[idx];
  const q = currentTopic.questions[qIndex];
  answered = false;

  const soundIcon = soundOn ? '&#128266;' : '&#128263;';
  const soundClass = soundOn ? '' : 'off';

  let html = `<div class="meta-row">
      <button class="back-btn" id="back-btn">&larr; Topics</button>
      <span class="topic-name">${escapeHtml(currentTopic.label)}${reviewMode ? ' · Review' : ''}</span>
      <span class="score">Score: <b>${score}</b></span>
      <button class="sound-toggle ${soundClass}" id="sound-toggle" title="Toggle read-aloud">${soundIcon}</button>
    </div>
    <div class="track"><div class="track-fill" id="track-fill" style="width:${(idx/list.length*100)}%"></div></div>
    <h1 class="q">${escapeHtml(q.q)}</h1>
    <div class="options">`;
  q.options.forEach((opt, i) => {
    html += `<button class="opt" data-i="${i}"><span class="letter">${letterOf(i)}</span><span>${escapeHtml(opt)}</span></button>`;
  });
  html += `</div>
    <div class="explain" id="explain">
      <span class="verdict" id="verdict"></span>
      <span id="explain-text"></span>
    </div>
    <div class="controls"><button class="next" id="next-btn">Next &rarr;</button></div>`;

  panel.innerHTML = html;

  document.getElementById('back-btn').addEventListener('click', () => {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    renderMenu();
  });
  document.getElementById('sound-toggle').addEventListener('click', () => {
    soundOn = !soundOn;
    if (!soundOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    renderQuestion();
  });
  document.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.i), q, qIndex));
  });
  document.getElementById('next-btn').addEventListener('click', nextQuestion);

  const optionsSpoken = q.options.map((opt, i) => `${letterOf(i)}. ${opt}`).join('. ');
  speak(`${q.q}. ${optionsSpoken}`);
}

function selectAnswer(choice, q, qIndex) {
  if (answered) return;
  answered = true;
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();

  const correct = q.answer;
  document.querySelectorAll('.opt').forEach((btn, i) => {
    btn.disabled = true;
    if (i === correct) btn.classList.add('correct');
    else if (i === choice) btn.classList.add('incorrect');
  });

  const isRight = choice === correct;
  if (isRight) score++;
  else if (!reviewMode) missed.push(qIndex);

  const verdict = document.getElementById('verdict');
  const explainText = document.getElementById('explain-text');
  verdict.textContent = isRight ? 'Correct' : `Incorrect — correct answer: ${letterOf(correct)}`;
  verdict.className = 'verdict ' + (isRight ? 'right' : 'wrong');
  explainText.textContent = q.explain;
  document.getElementById('explain').classList.add('show');
  document.getElementById('next-btn').classList.add('show');
}

function nextQuestion() {
  const list = currentList();
  idx++;
  if (idx >= list.length) showSummary();
  else renderQuestion();
}

function showSummary() {
  const list = currentList();
  const pct = Math.round((score / list.length) * 100);
  let html = `<div class="meta-row">
      <button class="back-btn" id="back-btn2">&larr; Topics</button>
      <span class="topic-name">${escapeHtml(currentTopic.label)}${reviewMode ? ' · Review' : ''}</span>
      <span></span><span></span>
    </div>
    <div class="summary">
    <div class="big">${score}/${list.length}</div>
    <div class="label">${pct}% correct</div>
    <div class="row">
      <button class="btn2 primary" id="restart-btn">Restart This Topic</button>
      ${(!reviewMode && missed.length > 0) ? '<button class="btn2" id="review-btn">Review Missed (' + missed.length + ')</button>' : ''}
      <button class="btn2" id="menu-btn">Choose Another Topic</button>
    </div>
  </div>`;
  panel.innerHTML = html;

  document.getElementById('back-btn2').addEventListener('click', renderMenu);
  document.getElementById('menu-btn').addEventListener('click', renderMenu);
  document.getElementById('restart-btn').addEventListener('click', () => startTopic(currentTopic.label, currentTopic.questions));
  const reviewBtn = document.getElementById('review-btn');
  if (reviewBtn) reviewBtn.addEventListener('click', () => {
    reviewMode = true;
    reviewList = [...missed];
    missed = [];
    idx = 0;
    score = 0;
    renderQuestion();
  });
}

renderMenu();
</script>
</body>
</html>
